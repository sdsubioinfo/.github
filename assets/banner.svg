<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07152B"/>
      <stop offset="50%" stop-color="#0A2240"/>
      <stop offset="100%" stop-color="#051024"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#FFA800"/>
      <stop offset="100%" stop-color="#FF7B00"/>
    </linearGradient>
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0077FE"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F2B54" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#071933" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGradient)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#1A3B6B" stroke-width="0.7" opacity="0.4">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="220" x2="1200" y2="220"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="100" y1="0" x2="100" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="500" y1="0" x2="500" y2="320"/>
    <line x1="700" y1="0" x2="700" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
    <line x1="1100" y1="0" x2="1100" y2="320"/>
  </g>

  <!-- Constellation / Network Graphics on Right Side -->
  <g opacity="0.85">
    <!-- Connecting Lines -->
    <path d="M 880 70 L 980 110 L 1110 80 L 1060 180 L 960 210 L 870 170 Z" fill="none" stroke="#0077FE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <path d="M 980 110 L 1060 180 M 880 70 L 960 210 M 870 170 L 980 110 M 1110 80 L 960 210" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.6"/>
    <path d="M 960 210 L 1020 270 L 1130 230 L 1060 180" fill="none" stroke="#FFA800" stroke-width="1.2" opacity="0.7"/>

    <!-- Nodes -->
    <circle cx="880" cy="70" r="8" fill="#00E5FF" filter="url(#glow)"/>
    <circle cx="980" cy="110" r="12" fill="#0077FE" stroke="#00E5FF" stroke-width="2"/>
    <circle cx="1110" cy="80" r="9" fill="#00E5FF"/>
    <circle cx="1060" cy="180" r="14" fill="#FFD100" stroke="#FFFFFF" stroke-width="2" filter="url(#glow)"/>
    <circle cx="960" cy="210" r="10" fill="#FFA800"/>
    <circle cx="870" cy="170" r="7" fill="#0077FE"/>
    <circle cx="1020" cy="270" r="8" fill="#FFD100"/>
    <circle cx="1130" cy="230" r="10" fill="#00E5FF" filter="url(#glow)"/>

    <!-- DNA Double Helix Motif (stylized) -->
    <path d="M 760 100 Q 790 140 820 180 T 880 260" fill="none" stroke="#00E5FF" stroke-width="2" opacity="0.5"/>
    <path d="M 760 180 Q 790 140 820 100 T 880 180" fill="none" stroke="#FFD100" stroke-width="2" opacity="0.5"/>
    <line x1="775" y1="120" x2="775" y2="160" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>
    <line x1="805" y1="140" x2="805" y2="140" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>
    <line x1="835" y1="160" x2="835" y2="120" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>
    <line x1="865" y1="210" x2="865" y2="170" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Left / Center Branding -->
  <g transform="translate(60, 0)">
    <!-- Top Super-header: SDSU Brand -->
    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#FFD100" letter-spacing="3.5">
      SOUTH DAKOTA STATE UNIVERSITY
    </text>

    <!-- Lab & Department Subhead -->
    <text x="0" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#A0C4E8" letter-spacing="1">
      Animal Disease Research and Diagnostic Laboratory (ADRDL) • Dept. of Veterinary &amp; Biomedical Sciences
    </text>

    <!-- Main Title: Bioinformatics & Computational Biology Group -->
    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">
      Bioinformatics &amp; Computational Genomics
    </text>

    <!-- Tagline -->
    <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#D2E4F8">
      Pioneering Pathogen Surveillance, Diagnostic Machine Learning &amp; Translational Virology
    </text>

    <!-- Pill Badges across bottom -->
    <g transform="translate(0, 224)">
      <!-- Badge 1: Diagnostic AI / ML -->
      <rect x="0" y="0" width="170" height="38" rx="8" fill="url(#cardBg)" stroke="#0077FE" stroke-width="1.5"/>
      <circle cx="20" cy="19" r="5" fill="#00E5FF"/>
      <text x="35" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Diagnostic AI &amp; ML</text>

      <!-- Badge 2: Viral Phylodynamics -->
      <rect x="185" y="0" width="195" height="38" rx="8" fill="url(#cardBg)" stroke="#0077FE" stroke-width="1.5"/>
      <circle cx="205" cy="19" r="5" fill="#FFD100"/>
      <text x="220" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Viral Phylodynamics</text>

      <!-- Badge 3: Codon & Host Adaptation -->
      <rect x="395" y="0" width="205" height="38" rx="8" fill="url(#cardBg)" stroke="#0077FE" stroke-width="1.5"/>
      <circle cx="415" cy="19" r="5" fill="#00E5FF"/>
      <text x="430" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Codon &amp; Host Adaptation</text>

      <!-- Badge 4: Pathogen Metagenomics -->
      <rect x="615" y="0" width="195" height="38" rx="8" fill="url(#cardBg)" stroke="#0077FE" stroke-width="1.5"/>
      <circle cx="635" cy="19" r="5" fill="#FFD100"/>
      <text x="650" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Pathogen Metagenomics</text>
    </g>
  </g>

  <!-- Accent Border Line at Bottom -->
  <rect x="0" y="315" width="1200" height="5" fill="url(#goldGradient)"/>
</svg>
